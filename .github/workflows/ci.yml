name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Lint (ruff)
        run: uvx ruff check phone.py harness/src

      - name: Lint shell scripts (shellcheck)
        run: shellcheck wda-up.sh viewer.sh
