name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    # The project drives an iPhone from a Mac, so it lints where it runs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # harness/ is a vendored fork of ShawnPana/phone-harness and keeps upstream style.
      - name: Lint (ruff)
        run: uvx ruff check phone.py

      - name: Check zsh syntax
        run: zsh -n wda-up.sh && zsh -n viewer.sh
